# Custom-config for the partial-async GUI-RL run.
#
# slime upstream reads this via --custom-config-path and setattr()s each key
# onto `args` (slime/utils/arguments.py: `if args.custom_config_path: ...`).
# We use it to inject the args that upstream slime does NOT register but our
# rollout/reward code reads via getattr(args, ...). This keeps slime unpatched.
#
# Why these keys live here (vs being plain CLI flags):
#   --gui-* / --dynamic-history are NOT in upstream slime's argparse, so passing
#   them on the CLI would be silently dropped by megatron's ignore_unknown_args.

# Training data mode. The split logic lives in OUR code
# (rollout/partial_async_rollout_gui.py -> rollout/trajectory.build_dynamic_history_samples):
# when True, each action step becomes an independent training sample.
dynamic_history: true

# Rollout-time GUI knobs. config.EpisodeConfig.resolve also falls back to GUI_*
# env vars, but we set them here so the full surface is in one place.
gui_max_steps: 30
# NOTE: tried 15s here (from 60s). reset dropped 61.8s->17.3s as expected, but it
# did NOT speed up training: running-req stayed flat (~2, rr=0 still 20%), so the
# "60s sleep starves sglang concurrency" theory was DISPROVEN. Worse, trajectories
# grew longer (median 13->25 steps, 45% hit the 30-step cap), likely because the
# env wasn't settled at 15s. Reverted to 60s pending an acc check.
gui_wait_after_reset: 60
gui_sleep_after_execution: 0.5
gui_max_image_history_length: 3

# Eval-time GUI knobs. These are read by getattr(args, ...) with NO env-var
# fallback (config.py:163/167/171), so they MUST come through here.
gui_eval_max_steps: 50
gui_eval_sleep_after_execution: 3.0
gui_eval_wait_after_reset: 60

# PRM (process reward) disabled for the initial bring-up: reward_func runs the
# outcome-only path (success +1 / else -1), no reward agent needed.
prm_enable: false